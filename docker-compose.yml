services:
  watch-playwright:
    image: watch-playwright
    restart: unless-stopped
    ipc: host
    environment:
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-1}

  watch-sender:
    image: watch-sender
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}

  watch-runner:
    image: watch-runner
    restart: unless-stopped
    depends_on:
      - watch-playwright
      - watch-sender
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUMMARIZE_CONCURRENCY=${SUMMARIZE_CONCURRENCY:-4}
      - MAX_FAIL_COUNT=${MAX_FAIL_COUNT:-5}
    ports:
      - "8001:8080"

  crawler-workhub:
    image: crawler-workhub
    restart: unless-stopped
    depends_on:
      - watch-playwright

  crawler-saramin:
    image: crawler-saramin
    restart: unless-stopped

  crawler-wanted:
    image: crawler-wanted
    restart: unless-stopped
    depends_on:
      - watch-playwright

  watch-ai:
    image: watch-ai
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - RPD_LIMIT=${RPD_LIMIT:-1500}
      - SUMMARIZER=${SUMMARIZER:-transcript}

  crawler-yt-channels:
    image: crawler-yt-channels
    restart: unless-stopped
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}

  crawler-kakao-channels:
    image: crawler-kakao-channels
    restart: unless-stopped
    depends_on:
      - watch-playwright

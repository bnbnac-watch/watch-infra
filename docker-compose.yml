services:
  watch-playwright:
    image: watch-playwright
    restart: unless-stopped
    init: true
    ipc: host
    mem_limit: ${PLAYWRIGHT_MEM_LIMIT:-1280m}
    memswap_limit: ${PLAYWRIGHT_MEM_LIMIT:-1280m}
    environment:
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-1}

  watch-admin:
    image: watch-admin
    restart: unless-stopped
    init: true
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WATCH_RUNNER_URL=http://watch-runner:8080
      - MAX_FAIL_COUNT=${MAX_FAIL_COUNT:-5}
    ports:
      - "8002:8080"

  watch-sender:
    image: watch-sender
    restart: unless-stopped
    init: true
    environment:
      - DATABASE_URL=${DATABASE_URL}

  watch-runner:
    image: watch-runner
    restart: unless-stopped
    init: true
    depends_on:
      - watch-playwright
      - watch-sender
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUMMARIZE_CONCURRENCY=${SUMMARIZE_CONCURRENCY:-4}
      - MAX_FAIL_COUNT=${MAX_FAIL_COUNT:-5}
    ports:
      - "8001:8080"

  crawler-workhub:
    image: crawler-workhub
    restart: unless-stopped
    init: true
    depends_on:
      - watch-playwright

  crawler-saramin:
    image: crawler-saramin
    restart: unless-stopped
    init: true

  crawler-wanted:
    image: crawler-wanted
    restart: unless-stopped
    init: true
    depends_on:
      - watch-playwright

  watch-ai:
    image: watch-ai
    restart: unless-stopped
    init: true
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - RPD_LIMIT=${RPD_LIMIT:-1500}
      - SUMMARIZER=${SUMMARIZER:-transcript}
      - AI_CONCURRENCY=${AI_CONCURRENCY:-2}
      - SUMMARIZE_TIMEOUT_S=${SUMMARIZE_TIMEOUT_S:-110}

  crawler-yt-channels:
    image: crawler-yt-channels
    restart: unless-stopped
    init: true
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}

  crawler-kakao-channels:
    image: crawler-kakao-channels
    restart: unless-stopped
    init: true
    depends_on:
      - watch-playwright

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '.env.example'
      - '**.md'

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest infra config
        run: git -C $HOME/watch-infra pull

      - name: Apply infra config
        run: bash $HOME/watch-infra/apply.sh
